name: clickout_guard
description: Guard app for ClickOut ecosystem.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ✅ Firebase Core & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  
  # ✅ Database
  cloud_firestore: ^5.4.4
  
  # ✅ Scanner & Utils
  mobile_scanner: ^5.2.3
  intl: ^0.19.0
  google_fonts: ^6.1.0
  pinput: ^5.0.0
  vibration: ^3.1.7
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
